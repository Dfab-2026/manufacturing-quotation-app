[project]
name = "dfab-quotation-api"
version = "0.14.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pydantic",
  "python-dotenv",
  "sqlalchemy>=2.0",
  "psycopg[binary]",
  "alembic",
  "pypdf",
  "pymupdf",
  "pillow",
  "openpyxl",
  "reportlab",
  "ezdxf>=1.4,<2",
  "numpy>=1.26,<3",
  "rapidocr>=3.10,<4",
  "onnxruntime>=1.18,<2",
]

[tool.vercel]
entrypoint = "api.index:app"
