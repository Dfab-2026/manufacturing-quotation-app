[project]
name = "dfab-quotation-api"
version = "0.14.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "python-multipart",
  "pydantic",
  "python-dotenv",
  "sqlalchemy>=2.0",
  "psycopg[binary]",
  "pypdf",
  "pymupdf",
  "pillow",
  "openpyxl",
  "reportlab",
  "ezdxf>=1.4,<2",
]

[tool.vercel]
entrypoint = "app.main:app"
